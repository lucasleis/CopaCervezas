<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muestra inscripta — Copa Argentina de Cervezas</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .card {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 32px;
      }
      .titulo {
        margin: 0 0 16px;
        font-size: 20px;
        color: #18181b;
      }
      .texto {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #3f3f46;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 8px;
      }
      td {
        padding: 10px 0;
        font-size: 14px;
        color: #3f3f46;
        border-bottom: 1px solid #e4e4e7;
      }
      td.label {
        color: #71717a;
        width: 45%;
      }
      td.valor {
        font-weight: 600;
        color: #18181b;
        text-align: right;
      }
      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="titulo">Hola, {{.NombreCerveceria}}</p>
        <p class="texto">Tu muestra fue inscripta correctamente en la competencia. Estos son los datos:</p>
        <table>
          <tr>
            <td class="label">Nombre comercial</td>
            <td class="valor">{{.NombreCerveza}}</td>
          </tr>
          <tr>
            <td class="label">Código de estilo</td>
            <td class="valor">{{.CodigoEstilo}}</td>
          </tr>
          <tr>
            <td class="label">Estilo</td>
            <td class="valor">{{.NombreEstilo}}</td>
          </tr>
          <tr>
            <td class="label">Estado de la muestra</td>
            <td class="valor">{{.EstadoMuestra}}</td>
          </tr>
        </table>
      </div>
      <p class="footer">Copa Argentina de Cervezas</p>
    </div>
  </body>
</html>
