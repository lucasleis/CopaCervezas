<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificá tu cuenta — Copa Argentina de Cervezas</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .card {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 32px;
      }
      .titulo {
        margin: 0 0 16px;
        font-size: 20px;
        color: #18181b;
      }
      .texto {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #3f3f46;
      }
      .boton {
        display: inline-block;
        background-color: #b45309;
        color: #ffffff !important;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 6px;
      }
      .nota {
        margin: 24px 0 0;
        font-size: 13px;
        color: #71717a;
      }
      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 12px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="titulo">Hola, {{.Nombre}}</p>
        <p class="texto">
          Gracias por registrarte en Copa Argentina de Cervezas. Antes de continuar, necesitamos
          que verifiques tu dirección de correo electrónico.
        </p>
        <p style="text-align: center; margin: 0 0 24px">
          <a class="boton" href="{{.URL}}">Verificar mi cuenta</a>
        </p>
        <p class="nota">Este link expira en 24 horas. Si vos no creaste esta cuenta, podés ignorar este mail.</p>
      </div>
      <p class="footer">Copa Argentina de Cervezas</p>
    </div>
  </body>
</html>
